name: AI 圈每日要闻推送
# 正式推送的运行名带「（定时）」，防重复检查靠它区分测试运行。
run-name: ${{ (github.event_name == 'schedule' || inputs.mode == 'scheduled') && 'AI 圈每日要闻推送（定时）' || 'AI 圈每日要闻推送（测试）' }}

on:
  # 主触发：cron-job.org 每天 08:00 调用 workflow_dispatch（mode=scheduled），准点运行。见 README。
  workflow_dispatch:
    inputs:
      mode:
        description: "test：立即推送，不影响正式推送的防重复判断；scheduled：正式推送（cron-job.org 用这个）"
        type: choice
        options: [test, scheduled]
        default: test
  schedule:
    # 兜底：每天 08:17 北京时间 (= 00:17 UTC)。Actions 定时任务偶尔会延迟几个小时，所以只作兜底；不选整点是因为整点最拥挤。
    - cron: "17 0 * * *"

# 主触发和兜底都会运行：排队依次执行，后运行的发现已推送就跳过。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.mode == 'scheduled'
    uses: ./.github/workflows/already-pushed.yml
    with:
      workflow: ai-news.yml

  push:
    needs: check
    # 测试运行时 check 被跳过，这里仍要运行。
    if: ${{ !failure() && !cancelled() && needs.check.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm test
      - run: npm run ai-news
        env:
          # 两个 key 都可以不配：都没有时按规则排序 + 翻译标题。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 可选，在 Settings → Secrets and variables → Actions → Variables 里配置。
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
